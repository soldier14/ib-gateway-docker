name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    uses: quantquantquant/platform-ci/.github/workflows/service-ci.yml@main
    with:
      working_directory: .
      build_cmd: |
        docker build -t ib-gateway:ci ./stable
      deploy_cmd: |
        if [ "${GITHUB_REF}" != "refs/heads/main" ] && [ "${GITHUB_REF}" != "refs/heads/master" ]; then
          echo "Skip deploy on non-default branch"
          exit 0
        fi
        if [ -z "${DEPLOY_TOKEN:-}" ]; then
          echo "DEPLOY_TOKEN not set; skipping deploy"
          exit 0
        fi
        echo "${DEPLOY_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
        docker build -t "ghcr.io/${GITHUB_REPOSITORY_OWNER}/ib-gateway:stable" ./stable
        docker build -t "ghcr.io/${GITHUB_REPOSITORY_OWNER}/ib-gateway:latest" ./latest
        docker push "ghcr.io/${GITHUB_REPOSITORY_OWNER}/ib-gateway:stable"
        docker push "ghcr.io/${GITHUB_REPOSITORY_OWNER}/ib-gateway:latest"
    secrets:
      deploy_token: ${{ secrets.DEPLOY_TOKEN }}
